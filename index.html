<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0b19"><title>تلفون فاطمه 📱</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 15%,#332554,#080814 75%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;color:#fff;min-height:100dvh;display:grid;place-items:center}.phone{width:min(390px,100vw);height:min(844px,100dvh);position:relative;border:7px solid #24242a;border-radius:51px;overflow:hidden;background:#131226;box-shadow:0 25px 90px #000b,0 0 0 2px #6e6c7a}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 15%,#e98eaf 0%,#9863b0 24%,transparent 55%),radial-gradient(ellipse at 10% 90%,#314bba,#181b57 60%,#131026);filter:saturate(1.15)}.island{position:absolute;z-index:30;top:10px;left:50%;transform:translateX(-50%);width:115px;height:29px;background:#08080b;border-radius:20px}.status{position:absolute;z-index:29;top:15px;left:25px;right:24px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;direction:ltr}.screen{position:absolute;inset:0;overflow:auto;padding:56px 18px 88px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.home{text-align:center}.date{font-size:17px;margin-top:48px}.clock{font-size:72px;letter-spacing:-3px;font-weight:200}.greeting{font-size:13px;opacity:.85;margin:5px 0 35px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:21px 10px;margin-top:18px}.app{cursor:pointer;text-align:center;font-size:11px;text-shadow:0 1px 3px #222}.icon{width:59px;height:59px;margin:auto auto 7px;border-radius:15px;display:grid;place-items:center;font-size:29px;box-shadow:0 4px 12px #0003;background:#fff;color:#222}.dock{position:absolute;bottom:27px;left:15px;right:15px;border-radius:27px;background:#ffffff45;backdrop-filter:blur(25px);padding:12px;display:flex;justify-content:space-around}.dock .icon{margin:0;width:55px;height:55px}.appscreen{background:#f7f7fb;color:#17171b}.header{display:flex;align-items:center;gap:10px;margin:0 0 18px}.back{border:0;background:none;color:#1677f5;font-size:23px;cursor:pointer}.title{font-size:29px;font-weight:800}.sub{color:#868690;font-size:13px}.card{background:white;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;align-items:center;gap:12px;cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ddd1ff;font-size:24px;flex-shrink:0}.grow{flex:1}.name{font-size:16px;font-weight:700}.preview{font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;margin-top:5px}.pill{font-size:11px;color:#999}.messages{display:flex;flex-direction:column;gap:12px;padding:10px 0}.bubble{max-width:85%;padding:12px 14px;border-radius:17px;background:white;align-self:flex-start;line-height:1.8;font-size:15px;box-shadow:0 2px 5px #0001}.bubble.me{background:#d6f8c7;align-self:flex-end}.smalltime{font-size:10px;color:#888;display:block;text-align:left}.note{line-height:2;font-size:16px;white-space:pre-line}.search{width:100%;border:0;background:#e9e9ee;padding:13px;border-radius:12px;margin:5px 0 15px;font-size:14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.photo{aspect-ratio:1;background:linear-gradient(135deg,#d6c5ff,#ffe3ef);display:grid;place-items:center;font-size:47px;cursor:pointer;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo small{position:absolute;bottom:0;right:0;left:0;background:#0007;color:white;font-size:10px;padding:4px}.viewphoto{width:100%;max-height:57vh;object-fit:contain;border-radius:14px;background:#ddd}.action{border:0;border-radius:13px;background:#2479ef;color:white;padding:12px 16px;font-size:14px;cursor:pointer;margin:7px 0}.file{display:flex;align-items:center;gap:12px;padding:16px;background:white;border-radius:12px;margin:8px 0;cursor:pointer}.file span{font-size:30px}.camera{background:#08080a;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.camera video{width:100%;border-radius:14px;max-height:60vh;background:black}.camlabel{font-size:21px;font-weight:800;margin-bottom:15px}.camhint{font-size:13px;color:#bbb;margin-top:15px}.bottom{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:5px;background:#fff;z-index:40;cursor:pointer}.appscreen~.bottom{background:#1b1b1b}.toast{position:absolute;bottom:90px;left:20px;right:20px;padding:15px;border-radius:15px;background:#222d;color:#fff;z-index:35;text-align:center;display:none}.reveal{background:linear-gradient(145deg,#231849,#703e8d);color:white;text-align:center;padding:25px;border-radius:22px;margin-top:15px}.reveal h2{font-size:25px}.settings{font-size:13px;line-height:2;color:#555}input[type=file]{display:none}@media(max-width:400px){.phone{border-width:0;border-radius:0;width:100vw;height:100dvh}.grid{gap:16px 7px}}
</style></head><body><div class="phone"><div class="wall" id="wall"></div><div class="island"></div><div class="status"><span id="time">9:41</span><span>●●● ▰ 100%</span></div><main class="screen home" id="screen"></main><div class="dock" id="dock"></div><div class="toast" id="toast"></div><div class="bottom" onclick="home()"></div></div><input type="file" accept="image/*" multiple id="upload"><script>
const screen=document.getElementById('screen'),dock=document.getElementById('dock'),wall=document.getElementById('wall');let current='home';const apps=[['💬','واتساب','#24cf65','whatsapp'],['📝','الملاحظات','#fff2a5','notes'],['🌄','الصور','#fff','photos'],['📷','الكاميرا','#333','camera'],['📁','الملفات','#e9efff','files'],['📞','الهاتف','#4aca62','calls'],['✉️','الرسائل','#48d36a','sms'],['📅','التقويم','#fff','calendar'],['🔬','المختبر','#d7c8ff','lab'],['⚙️','الإعدادات','#b9bbc5','settings'],['🎵','الموسيقى','#ff6b96','music'],['🧭','Safari','#c8e9ff','safari']];const chats=[{name:'مريم 🤍',icon:'👩🏻',prev:'فطوم تكفين لا تنسين اللاب كوت',msgs:[['مريم','فطوم وينج؟'],['me','بالكليه شفيج 😭'],['مريم','الدكتورة تسأل عنج'],['me','قولي لها بالمختبر قاعده أنقذ العالم'],['مريم','انتي مو لاقيه قلمج من الصبح شنو تنقذين 💀']]},{name:'بنات المختبر 🧫',icon:'🧪',prev:'31/3 لا أحد ينسى 🤫',msgs:[['بنات','بنات منو مصور العينات؟'],['me','أنا مصورتهم بس نص الصور مو واضحه 😭'],['بنات','فاطمه هذا ميكروسكوب مو فلتر سناب'],['me','هههههههه خلاص بدزهم'],['بنات','ترى 31/3 قرب 🤫'],['me','شششش لا تحرقون المفاجأة']]},{name:'نوف 💗',icon:'💗',prev:'أقسم بالله الصورة تضحك',msgs:[['نوف','فطوووم شوفي القطو 😂'],['me','ليش قاعد يطالع بالتلسكوب كأنه يدور درجاتي؟'],['نوف','ههههههههههه'],['me','بحطه بالكاميرا مالي 😭']]},{name:'دكتورة المختبر 👩🏻‍🔬',icon:'👩🏻‍🔬',prev:'لا تنسون إجراءات السلامة',msgs:[['دكتورة','الرجاء الالتزام باللاب كوت والقفازات داخل المختبر.'],['me','إن شاء الله دكتورة 🌷']]}];const notes=[['أشياء لا أنساها 🧠','☐ اللاب كوت (للمرة المليون)\n☐ أقلامي اللي تختفي كل محاضرة\n☐ أصور العينات عدل\n☐ أراجع المايكرو\n☐ لا أحط القهوة يم العينات ☕'],['سوالف المختبر 😂','اليوم قعدت أدور السلايد عشر دقايق… طلع جدامي.\n\nالميكروسكوب شاف مني أشياء ما شافها أحد.\n\nإذا شفتوني ساكته يعني قاعدة أحسب درجاتي.'],['ملاحظات المايكرو 🔬','Microbiology = علم الأحياء الدقيقة.\n\nMicroscope: يساعدنا نشوف أشياء صغيرة ما تنشاف بالعين المجردة.\n\nPetri dish: طبق نستخدمه لزراعة الكائنات الدقيقة.\n\nمهم: نتبع تعليمات السلامة بالمختبر.'],['سر 31 مارس 🤫','الأربعاء 31/3\nالمكان: داخل كلية العلوم الطبية المساعدة – جامعة الكويت\n\nلا تقولون حق أحد شنو نجهز… خليهم يكتشفون بروحهم 👀']];let gallery=[{emoji:'🔬',name:'الميكروسكوب'},{emoji:'🧫',name:'عينات المايكرو'},{emoji:'🧪',name:'أنابيب المختبر'},{emoji:'🥼',name:'اللاب كوت'},{emoji:'🐈',name:'القطو العالم'},{emoji:'😭',name:'أنا بعد اختبار المايكرو'},{emoji:'🦠',name:'البكتيريا'},{emoji:'☕',name:'قهوة قبل اللاب'},{emoji:'🤓',name:'لما أفهم التجربة'},{emoji:'🔭',name:'القطو يدور درجاتي'},{emoji:'🧬',name:'DNA'},{emoji:'😂',name:'سلايد ضايع'}];try{gallery=gallery.concat(JSON.parse(localStorage.getItem('fatimaGallery')||'[]'))}catch(e){}let visited=new Set();function mark(s){visited.add(s);if(visited.size>=5)sessionStorage.setItem('found','1')}function top(title,sub=''){return `<div class="header"><button class="back" onclick="home()">‹</button><div><div class="title">${title}</div>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`}function setpage(name,html,dark=false){current=name;mark(name);wall.style.display='none';dock.style.display='none';screen.className='screen '+(dark?'camera':'appscreen');screen.innerHTML=html;screen.scrollTop=0}function icon(a){return `<div class="app" onclick="openApp('${a[3]}')"><div class="icon" style="background:${a[2]}">${a[0]}</div>${a[1]}</div>`}function home(){current='home';wall.style.display='block';dock.style.display='flex';screen.className='screen home';let d=new Date();screen.innerHTML=`<div class="date">الأربعاء، 18 نوفمبر</div><div class="clock" id="bigclock">${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div><div class="greeting">تلفون فاطمه ✨ | لا تفتشون وايد 👀</div><div class="grid">${apps.map(icon).join('')}</div>`;dock.innerHTML=[apps[5],apps[0],apps[2],apps[3]].map(a=>`<div onclick="openApp('${a[3]}')" class="icon" style="background:${a[2]}">${a[0]}</div>`).join('')}function openApp(s){if(s==='whatsapp'){setpage(s,top('واتساب','الدردشات')+`<input class="search" placeholder="بحث" oninput="filterChats(this.value)"><div id="chatlist">${chatRows('')}</div>`)}else if(s==='notes'){setpage(s,top('الملاحظات',`${notes.length} ملاحظات`)+notes.map((n,i)=>`<div class="card" onclick="note(${i})"><div class="name">${n[0]}</div><div class="preview">${n[1]}</div></div>`).join(''))}else if(s==='photos'){photos()}else if(s==='camera'){setpage(s,`<div class="camlabel">📷 كاميرا فاطمه السرّية</div><video src="assets/cat.mp4" controls autoplay loop playsinline></video><div class="camhint">هههههههه القطو قاعد يفتش بالفضا عن درجاتنا 😭🔭</div><button class="action" onclick="home()">ردّني للرئيسية</button>`,true)}else if(s==='files'){setpage(s,top('الملفات','على الـ iPhone')+[['📂','Microbiology','صور العينات موجودة بتطبيق الصور 🔬'],['📄','Lab Report - Final FINAL','كل مرة أقول فاينل وأعدل عليه 😭'],['🔒','TOP SECRET - 31 March','معلومة سرية: الأربعاء 31 مارس داخل كلية العلوم الطبية المساعدة!'],['📁','University Stuff','جامعة الكويت – مختبرات طبية']].map((x,i)=>`<div class="file" onclick="fileView(${i})"><span>${x[0]}</span><div class="grow"><div class="name">${x[1]}</div><div class="sub">ملف فاطمه</div></div>›</div>`).join(''))}else if(s==='calls'){setpage(s,top('الأخيرة','المكالمات')+[['مريم 🤍','فائتة','اليوم 10:42'],['نوف','واردة','أمس 9:12'],['بنات المختبر','فائتة','أمس 8:30'],['الدكتورة','واردة','الأحد 11:01']].map(x=>`<div class="card row"><span style="color:#28a9ff;font-size:25px">☎</span><div class="grow"><div class="name">${x[0]}</div><div class="sub">${x[1]}</div></div><span class="pill">${x[2]}</span></div>`).join(''))}else if(s==='sms'){setpage(s,top('الرسائل')+`<div class="card"><b>كلية العلوم الطبية المساعدة 🧪</b><p>ترقبوا شي غير يوم الأربعاء 31 مارس 👀</p></div><div class="card"><b>مريم</b><p>فطوم ردي علييي وينج 😭</p></div>`)}else if(s==='calendar'){setpage(s,top('التقويم')+`<div class="reveal"><h2>🗓️ الأربعاء 31 مارس</h2><p>لا تحطون خطط ثانية… عندنا شي بالكليّة 🔬✨</p><p>كلية العلوم الطبية المساعدة – جامعة الكويت</p></div>`)}else if(s==='lab'){setpage(s,top('مختبرات فاطمه 🔬')+`<div class="card note">🧫 المايكرو: عالم صغير بس سوالفه وايد!<br>🔬 الميكروسكوب: رفيجنا باللاب.<br>🥼 السلامة أول شي، حتى لو مستعيلين.<br>🧪 كل عينة وراها معلومة.</div><div class="reveal"><h2>🎉 المفاجأة!</h2><p>يوم المختبرات 🔬🧫</p><p>الأربعاء 31 مارس<br>داخل كلية العلوم الطبية المساعدة<br>جامعة الكويت</p><b>نبي نشوفكم كلكم! 💗</b></div>`)}else if(s==='settings'){setpage(s,top('الإعدادات')+`<div class="card"><div class="name">👩🏻‍🔬 تلفون فاطمه</div><div class="settings">هذا موقع تفاعلي خيالي لفعالية المختبرات.<br>لإضافة صورج: افتحي الصور واضغطي «أضيف صور»؛ الصور تنحفظ بهذا المتصفح فقط.<br>اضغطي الخط اللي تحت عشان تردين للرئيسية.</div></div>`)}else{setpage(s,top(s==='music'?'الموسيقى 🎵':'Safari 🧭')+`<div class="card note">${s==='music'?'🎧 قائمة التشغيل: أغاني قبل اختبار المايكرو 😭':'🔎 آخر بحث: شلون أنجح بالمايكرو بدون ما أنام؟ 😂'}</div>`)}}function chatRows(q){return chats.filter(c=>c.name.includes(q)||c.prev.includes(q)).map(c=>`<div class="card row" onclick="chat(${chats.indexOf(c)})"><div class="avatar">${c.icon}</div><div class="grow"><div class="name">${c.name}</div><div class="preview">${c.prev}</div></div><span class="pill">اليوم</span></div>`).join('')}function filterChats(q){document.getElementById('chatlist').innerHTML=chatRows(q)}function chat(i){let c=chats[i];setpage('chat',`<div class="header"><button class="back" onclick="openApp('whatsapp')">‹</button><div class="avatar">${c.icon}</div><div><div class="name">${c.name}</div><div class="sub">متصل الآن</div></div></div><div class="messages">${c.msgs.map(([who,m])=>`<div class="bubble ${who==='me'?'me':''}">${m}<span class="smalltime">10:42 ✓✓</span></div>`).join('')}</div>`)}function note(i){setpage('note',`<div class="header"><button class="back" onclick="openApp('notes')">‹ الملاحظات</button></div><div class="sub">اليوم، 10:42 م</div><h2>${notes[i][0]}</h2><div class="note">${notes[i][1]}</div>`)}function photos(){setpage('photos',top('الصور','الأخيرة')+`<button class="action" onclick="document.getElementById('upload').click()">＋ أضيف صور من جهازي</button><div class="sub">الصور المضافة تنحفظ على جهازج فقط، مو عند كل الزوار.</div><div class="photos">${gallery.map((p,i)=>`<div class="photo" onclick="showPhoto(${i})">${p.src?`<img src="${p.src}" alt="${p.name}">`:p.emoji}<small>${p.name}</small></div>`).join('')}</div>`)}function showPhoto(i){let p=gallery[i];setpage('photo',`<div class="header"><button class="back" onclick="photos()">‹ الصور</button></div>${p.src?`<img class="viewphoto" src="${p.src}">`:`<div class="photo" style="height:48vh;font-size:130px">${p.emoji}</div>`}<h3>${p.name}</h3><p class="sub">من ألبوم فاطمه 📸</p>`)}function fileView(i){let a=[['Microbiology','صور العينات موجودة بتطبيق الصور 🔬'],['Lab Report - Final FINAL','كل مرة أقول فاينل وأعدل عليه 😭'],['TOP SECRET - 31 March','🤫 الأربعاء 31 مارس: يوم المختبرات داخل كلية العلوم الطبية المساعدة – جامعة الكويت.'],['University Stuff','جامعة الكويت – كلية العلوم الطبية المساعدة – تخصص المختبرات']][i];setpage('file',`<div class="header"><button class="back" onclick="openApp('files')">‹ الملفات</button></div><div class="card note"><h2>${a[0]}</h2>${a[1]}</div>`)}function toast(t){let el=document.getElementById('toast');el.innerText=t;el.style.display='block';setTimeout(()=>el.style.display='none',3500)}document.getElementById('upload').onchange=async e=>{let files=[...e.target.files].slice(0,12);for(let f of files){let src=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});gallery.push({src,name:f.name})}try{localStorage.setItem('fatimaGallery',JSON.stringify(gallery.filter(p=>p.src)))}catch(e){toast('الصور كبيرة وما قدرت أحفظها، بس بتظل موجودة لين تحدثين الصفحة')}photos()};setInterval(()=>{let t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});document.getElementById('time').textContent=t;let b=document.getElementById('bigclock');if(b)b.textContent=t},10000);home();
</script></body></html>
